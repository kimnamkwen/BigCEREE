            <p>
              프로젝트 신규 참여 또는 협업을 희망하는 연구자, 기관, 기업 대상 절차 및 연락 방법 안내.<br>
              참여신청 절차, 필요서류, 협력 및 지원 옵션 등 상세 안내.
            </p>
          `}
        ]
      }
    };

    const siteHubs = {
      home: `
        <nav class="site-hub site-hub-home" aria-label="홈 바로가기">
          <div class="site-hub-links">
            <a href="#center" data-site-route>
              <strong>센터 소개</strong>
              <span>센터장과 주요 연구사업 소개</span>
            </a>
            <a href="#center/paper" data-site-route>
              <strong>발표논문</strong>
              <span>제목, 저자, 학술지로 논문 검색</span>
            </a>
            <a href="classes/index.html">
              <strong>수업</strong>
              <span>입장 가능한 주차와 수업 자료</span>
            </a>
            <a href="#research" data-site-route>
              <strong>연구 분야</strong>
              <span>임상 연구, 빅데이터 분석, 경제성평가</span>
            </a>
          </div>
        </nav>`,
      research: `
        <section class="site-hub" aria-labelledby="site-hub-title">
          <h2 id="site-hub-title">연구 분야</h2>
          <div class="site-hub-links">
            <a href="#clinical" data-site-route><strong>임상 연구</strong></a>
            <a href="#bigdata" data-site-route><strong>빅데이터 분석</strong></a>
            <a href="#economic" data-site-route><strong>경제성평가</strong></a>
          </div>
        </section>`
    };

    const mainMenuEl = document.getElementById('main-menu');
    const sideNavEl = document.getElementById('side-nav');
    const mainContentEl = document.getElementById('main-content');
    const publicationsHash = '#center/paper';
    const mobileHomeLayout = window.matchMedia('(max-width: 900px), (max-width: 960px) and (max-height: 500px)');
    let currentMenu;
    let currentSubKey;
    let stopPublications;

    function markCurrentLink(link, current, kind) {
      link.classList.toggle('active', current);
      if (current) link.setAttribute('aria-current', kind);
      else link.removeAttribute('aria-current');
    }

    function markCurrentMenu(menuKey) {
      for (const link of mainMenuEl.querySelectorAll('[data-menu]')) {
        markCurrentLink(link, link.dataset.menu === menuKey, 'location');
      }
    }

    function renderSideNav(menuKey) {
      sideNavEl.hidden = Object.hasOwn(siteHubs, menuKey);
      if (sideNavEl.hidden) {
        sideNavEl.replaceChildren();
        return;
      }
      sideNavEl.dataset.sectionLabel = menuData[menuKey].label;
      sideNavEl.innerHTML = `<h2 id="side-nav-heading">${menuData[menuKey].label} 세부 목록</h2>
        <ul class="nav-list">
          ${menuData[menuKey].submenus.map(sub => {
            const current = sub.key === currentSubKey;
            const route = `${menuKey}/${sub.key}`;
            return `<li><a class="nav-link${current ? ' active' : ''}" data-site-route href="#${route}"${current ? ' aria-current="page"' : ''}>${sub.label}</a></li>`;
          }).join('')}
        </ul>`;
    }

    function renderContent(menuKey, subKey) {
      if (Object.hasOwn(siteHubs, menuKey)) {
        mainContentEl.innerHTML = siteHubs[menuKey];
        return;
      }
      const submenu = menuData[menuKey].submenus.find(s=>s.key===subKey);
      mainContentEl.innerHTML = submenu ? submenu.content : "<p>해당 내용을 불러올 수 없습니다.</p>";
      if (menuKey === 'center' && subKey === 'paper') {
        const section = document.getElementById('publications');
        if (typeof showPublications === 'function') stopPublications = showPublications(section, sideNavEl);
        else section.querySelector('.publication-feedback').textContent = '논문 목록을 불러올 수 없습니다.';
      }
    }

    document.addEventListener('click', event => {
      const link = event.target.closest('a[data-site-route], a[data-menu]');
      if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      const url = new URL(location.href);
      url.hash = link.hash;
      if (url.hash !== publicationsHash && typeof clearPublicationQuery === 'function') clearPublicationQuery(url);
      if (url.href !== location.href) history.pushState(null, '', url);
      openMenuFromHash();
      if (event.detail === 0) mainContentEl.focus({ preventScroll: true });
    });
    document.querySelector('.skip-link').addEventListener('click', event => {
      event.preventDefault();
      mainContentEl.focus();
    });

    function openMenuFromHash() {
      const [requested, submenuKey] = location.hash.slice(1).split('/');
      let key = Object.hasOwn(menuData, requested) || Object.hasOwn(siteHubs, requested) ? requested : 'home';
      if (key === 'home' && !mobileHomeLayout.matches) key = 'center';
      const submenus = Object.hasOwn(menuData, key) ? menuData[key].submenus : [];
      const legacySubmenu = key === 'center' ? history.state?.centerSubmenu : undefined;
      const submenu = submenus.find(item => item.key === (submenuKey || legacySubmenu)) ?? submenus[0];
      const subKey = submenu?.key;
      if (key === currentMenu && subKey === currentSubKey) return;
      stopPublications?.();
      stopPublications = undefined;
      currentMenu = key;
      currentSubKey = subKey;
      markCurrentMenu(key);
      renderSideNav(key);
      renderContent(key, currentSubKey);
      document.dispatchEvent(new Event('site-navigation-change'));
    }
    window.addEventListener('hashchange', openMenuFromHash);
    window.addEventListener('popstate', openMenuFromHash);
    mobileHomeLayout.addEventListener('change', openMenuFromHash);

    openMenuFromHash();
  </script>
</body>
</html>
