<script>
  // ---------- 원본 슬라이드: 이미지가 없으면 안내 상자 표시 ----------
  document.querySelectorAll("details.slides").forEach(d => {
    const grid = document.createElement("div"); grid.className = "slide-grid";
    for (let n = +d.dataset.from; n <= +d.dataset.to; n++) {
      const fig = document.createElement("figure"); fig.className = "slide-fig";
      const img = new Image(); img.loading = "lazy"; img.alt = `슬라이드 ${n}`;
      img.src = LESSON.assetDir + LESSON.slidePattern(n);
      img.onerror = () => { img.replaceWith(Object.assign(document.createElement("div"),
        { className: "slide-missing", textContent: `슬라이드 ${n} 이미지 준비 중` })); };
      const cap = document.createElement("figcaption"); cap.textContent = `${n} / ${LESSON.totalSlides}`;
      fig.append(img, cap); grid.append(fig);
    }
    d.append(grid);
  });

  // ---------- 상단 도구 ----------
  const pdfBtn = document.getElementById("btn-pdf");
  if (pdfBtn) pdfBtn.href = LESSON.assetDir + LESSON.slidePdf;
  document.getElementById("btn-print").onclick = () => window.print();
  let scale = 1;
  const applyScale = () => document.querySelector(".lesson-main").style.setProperty("--lesson-scale", scale);
  document.getElementById("btn-font-up").onclick = () => { scale = Math.min(1.5, scale + 0.1); applyScale(); };
  document.getElementById("btn-font-down").onclick = () => { scale = Math.max(0.8, scale - 0.1); applyScale(); };

  // ---------- 목차: 현재 위치 강조 ----------
  const tocLinks = [...document.querySelectorAll(".lesson-toc a")];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) tocLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll(".lesson-main h2[id], .lesson-main h3[id]").forEach(h => io.observe(h));
</script>

<!-- webR 준비(공통): vas.csv를 webR 작업 폴더에 넣어 read.csv("vas.csv")로 읽게 함 -->
<script src="../../../../lessons/bios-data/bios-webr.js"></script>
<script type="module">
  document.querySelectorAll(".r-cell").forEach(cell => {
    const ta = cell.querySelector("textarea");
    const out = cell.querySelector(".r-out");
    const original = ta.value;
    const pkgs = (cell.dataset.pkgs || "").split(",").filter(Boolean);
    const autosize = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 4 + "px"; };
    autosize(); ta.addEventListener("input", autosize);

    cell.querySelector(".reset-btn").onclick = () => { ta.value = original; autosize(); out.textContent = ""; cell.querySelectorAll("img.r-plot").forEach(i => i.remove()); };

    cell.querySelector(".run-btn").onclick = async () => {
      out.textContent = "R 준비 중… (처음 실행 시 10~30초" + (pkgs.length ? ", 패키지 내려받기 포함" : "") + ")";
      cell.querySelectorAll("img.r-plot").forEach(i => i.remove());
      try {
        const webR = await window.getBiosWebR(pkgs);
        out.textContent = "실행 중…";
        const shelter = await new webR.Shelter();
        try {
          const res = await shelter.captureR(ta.value, {
            withAutoprint: true, captureStreams: true, captureConditions: false,
            captureGraphics: { width: 640, height: 400 }
          });
          out.textContent = res.output.map(o => (o.type === "stderr" ? "⚠ " : "") + o.data).join("\n") || "(출력 없음)";
          for (const bmp of res.images || []) {
            const canvas = document.createElement("canvas");
            canvas.width = bmp.width; canvas.height = bmp.height;
            canvas.getContext("2d").drawImage(bmp, 0, 0);
            const img = document.createElement("img");
            img.className = "r-plot"; img.src = canvas.toDataURL("image/png");
            img.style.cssText = "display:block;max-width:100%;background:#fff;border-top:1px solid #e2e8f0";
            cell.append(img);
          }
        } finally { shelter.purge(); }
      } catch (e) {
        out.textContent = "오류: " + (e && e.message ? e.message : e);
      }
    };
  });
</script>
